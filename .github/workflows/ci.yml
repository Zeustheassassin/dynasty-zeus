name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build
        run: npm run build
        env:
          # Placeholder values satisfy Next.js at build time — real values are injected
          # by the deployment platform (Vercel) at runtime, not needed here.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test
